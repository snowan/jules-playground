name: Daily Anime Report

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC every day
  workflow_dispatch: # Allows manual triggering

jobs:
  build_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push commits back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9' # Specify a Python version
          cache: 'pip' # Cache dependencies to speed up future runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt # Assumes requirements.txt will be created

      - name: Run anime scraper script
        run: python anime_scraper.py

      - name: Commit and push if changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add japanese-animes/ # Add all files in the directory
          # Check if there are changes to commit
          if ! git diff --staged --quiet; then
            # If there are changes, create a commit
            git commit -m "Automated daily anime report for $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit."
          fi
